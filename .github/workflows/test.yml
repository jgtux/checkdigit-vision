name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # pyzbar loads libzbar at import time; the unit tests never call OCR,
      # but application.read imports pytesseract, which needs no binary to import
      - run: sudo apt-get update && sudo apt-get install -y libzbar0
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
